name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Vercel API
        run: |
          echo "Pinging Vercel Keep-Alive endpoint..."
          curl -s -X GET "https://decoration-bay.vercel.app/api/cron/keep-alive" || true
          echo "Keep-alive ping sent successfully!"
